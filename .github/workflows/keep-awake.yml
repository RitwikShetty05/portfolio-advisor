name: Keep Streamlit app awake

# WHY A HEADLESS BROWSER (not a plain curl):
# Streamlit Community Cloud's free tier counts "activity" as a real browser
# SESSION — a client that loads the page and opens the WebSocket that runs
# the app script. A bare HTTP GET (UptimeRobot, curl) never opens that
# WebSocket, so it does NOT reset the inactivity timer and the app still
# sleeps. Worse, the "gone to sleep" page itself returns HTTP 200, so a
# plain pinger reports "UP" while the app is actually down.
#
# This job opens the app in a real headless Chromium, clicks the wake
# button if the app is asleep, and holds the session open briefly so it
# registers as genuine traffic — the only thing that actually keeps a free
# Streamlit app warm.
#
# Caveats:
#   * GitHub delays scheduled jobs under load; the real interval can be
#     longer than requested. ~Every 15 min is plenty.
#   * GitHub auto-disables scheduled workflows after 60 days with no repo
#     commits — re-enable in the Actions tab if pings ever stop.
#   * This is the most reliable FREE method, but not guaranteed forever.
#     The only true always-on is paid hosting (see SESSION_HANDOFF.md).

on:
  schedule:
    # Offset from :00 to dodge the top-of-hour scheduler congestion.
    - cron: "3,18,33,48 * * * *"
  workflow_dispatch: {}   # manual trigger from the Actions tab

concurrency:
  group: keep-awake
  cancel-in-progress: true

jobs:
  visit:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Playwright + Chromium
        run: |
          pip install --quiet playwright
          python -m playwright install --with-deps chromium

      - name: Visit the app like a real browser (wakes it if asleep)
        env:
          APP_URL: "https://ritwik-portfolio-advisor.streamlit.app/"
        run: |
          python - <<'PY'
          import os, re, time
          from playwright.sync_api import sync_playwright

          url = os.environ["APP_URL"]
          with sync_playwright() as p:
              browser = p.chromium.launch()
              page = browser.new_page()
              page.goto(url, wait_until="domcontentloaded", timeout=60000)

              # If asleep, Streamlit renders a "Yes, get this app back up!"
              # button — clicking it triggers the real wake/boot.
              try:
                  wake = page.get_by_role("button", name=re.compile("back up", re.I))
                  if wake.count() > 0:
                      print("App was asleep — clicking the wake button.")
                      wake.first.click()
              except Exception as e:
                  print("wake-button check skipped:", e)

              # Wait for the actual Streamlit app shell to render — this is
              # what confirms a live session was established (and gives a
              # cold-booting app time to come up).
              try:
                  page.wait_for_selector('[data-testid="stApp"]', timeout=120000)
                  print("App is awake and rendered. OK")
              except Exception:
                  print("stApp not visible yet — app may still be booting.")

              # Hold the session open a moment so it counts as real traffic.
              time.sleep(15)
              browser.close()
          PY
